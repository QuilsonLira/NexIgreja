name: MySQL migration validation

on:
  push:
    branches:
      - mysql-migration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile for MySQL dependencies
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate MySQL schema
        run: npm run db:mysql:schema

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Upload migration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-migration-artifacts
          path: |
            package-lock.json
            db/schema.mysql.ts
          if-no-files-found: warn

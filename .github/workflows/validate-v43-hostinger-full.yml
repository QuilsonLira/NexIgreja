name: Validar v43 Hostinger completo

on:
  push:
    branches:
      - upgrade-v43-2026-08-14
    paths-ignore:
      - '.validation/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: build_root_password
          MARIADB_DATABASE: nexigreja_build
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root:build_root_password@127.0.0.1:3306/nexigreja_build
      APP_ORIGIN: https://example.com
      SESSION_HMAC_KEY: build-only-session-key-00000000000000000000000000000000
      CPF_LOOKUP_HMAC_KEY: build-only-cpf-key-000000000000000000000000000000000
      AUDIT_HMAC_KEY: build-only-audit-key-00000000000000000000000000000000
      SESSION_TTL_HOURS: '12'
      AUTH_MAX_ATTEMPTS: '5'
      AUTH_BLOCK_MINUTES: '15'
      COOKIE_SECURE: 'true'
      ALLOW_TEST_USERS: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirmar que e a v43 adaptada
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='0.43.0') throw new Error('Versao esperada: 0.43.0')"
          test -f lib/server/mysql-d1.ts
          test -f mysql/schema.sql
          test -f scripts/mysql-migrate.mjs
          test -f next.config.mjs
          grep -R -q '/api/public/institution' components app
          grep -R -Eq 'maxLength=\{7\}|7.{0,40}(d[ií]git|digit)' components app
          test ! -d .upgrade

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Migrar schema no MariaDB
        run: npm run db:migrate

      - name: Conferir quantidade de tabelas
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import mysql from 'mysql2/promise';
          const c = await mysql.createConnection(process.env.DATABASE_URL);
          const [rows] = await c.query("SELECT COUNT(*) AS n FROM information_schema.tables WHERE table_schema='nexigreja_build'");
          console.log('Tabelas criadas:', rows[0].n);
          if (Number(rows[0].n) < 108) throw new Error('Schema incompleto');
          await c.end();
          NODE

      - name: TypeScript
        run: npm run typecheck

      - name: Build Next.js
        run: npm run build

      - name: Registrar validacao
        if: success()
        shell: bash
        run: |
          mkdir -p .validation
          printf 'v43 Hostinger validada\ncommit=%s\n' "$GITHUB_SHA" > .validation/v43-hostinger-build-ok.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .validation/v43-hostinger-build-ok.txt
          git diff --cached --quiet || git commit -m 'Registra validacao da v43 Hostinger'
          git push origin HEAD:upgrade-v43-2026-08-14

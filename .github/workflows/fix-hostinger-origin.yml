name: Validate Hostinger trusted origin fix

on:
  push:
    branches:
      - fix-hostinger-origin
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-hostinger-origin

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Apply trusted-origin patch
        run: node scripts/patch-hostinger-trusted-origin.mjs

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit patched auth.ts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/server/auth.ts
          if git diff --cached --quiet; then
            echo "auth.ts already patched"
          else
            git commit -m "Corrige origem confiável atrás do proxy da Hostinger"
            git push origin HEAD:fix-hostinger-origin
          fi

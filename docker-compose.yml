services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nexigreja
      MYSQL_USER: nexigreja
      MYSQL_PASSWORD: nexigreja_local
      MYSQL_ROOT_PASSWORD: root_local_somente_desenvolvimento
    ports:
      - "3306:3306"
    volumes:
      - nexigreja_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  nexigreja_mysql:
